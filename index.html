<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Calorie</title>
  <link rel="manifest" href="manifest.json" />
  <link id="fav-icon" rel="icon" type="image/jpeg" href="logo_cinnamoroll_diet.jpg" />
  <link id="apple-icon" rel="apple-touch-icon" href="logo_cinnamoroll_diet.jpg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Calorie" />
  <meta name="theme-color" content="#F2FAFF" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@500;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      font-family: "Noto Sans Thai", "Poppins", sans-serif;
      background: linear-gradient(160deg, #E1F3FE 0%, #FDF2F8 55%, #FFFBEB 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1E3A5F;
    }
    .lock-card {
      width: 100%;
      max-width: 360px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border: 3px solid #CAE9FF;
      border-radius: 32px;
      padding: 26px 22px 24px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(79, 168, 224, 0.18);
    }
    .logo-preview {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      object-fit: cover;
      border: 3px solid #FFF;
      box-shadow: 0 8px 20px rgba(79, 168, 224, 0.25);
      margin-bottom: 10px;
    }
    .icon-switch-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .ic-btn {
      border: 1.5px solid #CAE9FF;
      background: #F8FCFF;
      color: #256FA3;
      font-family: inherit;
      font-size: 10.5px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 99px;
      cursor: pointer;
    }
    .ic-btn.active {
      background: #4FA8E0;
      color: #FFF;
      border-color: #256FA3;
    }
    h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    p { font-size: 12.5px; color: #52799D; margin-bottom: 16px; }
    .dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #93C5FD;
      background: #FFF;
      transition: 0.15s;
    }
    .dot.filled {
      background: #4FA8E0;
      border-color: #256FA3;
      transform: scale(1.1);
    }
    .dot.err {
      background: #EF4444;
      border-color: #B91C1C;
    }
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .key {
      height: 54px;
      border-radius: 18px;
      border: 2px solid #E0F2FE;
      background: #FFFFFF;
      color: #1E3A5F;
      font-family: "Poppins", "Noto Sans Thai", sans-serif;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #BAE6FD;
      transition: 0.08s;
    }
    .key:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #BAE6FD;
    }
    .err-msg {
      color: #DC2626;
      font-size: 12px;
      font-weight: 700;
      min-height: 18px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="lock-card" id="lock-box">
    <img id="lock-logo-img" src="logo_cinnamoroll_diet.jpg" class="logo-preview" alt="Calorie" />
    <div class="icon-switch-row">
      <button id="btn-ic-cin" class="ic-btn active" onclick="chooseHomeIcon('logo_cinnamoroll_diet.jpg')">☁️ Cinnamoroll</button>
      <button id="btn-ic-pom" class="ic-btn" onclick="chooseHomeIcon('logo_pompompurin_fit.jpg')">🍮 Pompompurin</button>
      <button id="btn-ic-mus" class="ic-btn" onclick="chooseHomeIcon('pompom_muscle_avatar.jpg')">🍮💪 ปอมๆ กล้ามดุ</button>
    </div>
    <h2>🔒 Calorie Private</h2>
    <p>กรุณาใส่รหัส PIN 6 หลักของคุณพอล & คุณแฟน</p>
    <div class="err-msg" id="pin-err"></div>
    <div class="dots" id="pin-dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="pad">
      <button class="key" onclick="pressPin('1')">1</button>
      <button class="key" onclick="pressPin('2')">2</button>
      <button class="key" onclick="pressPin('3')">3</button>
      <button class="key" onclick="pressPin('4')">4</button>
      <button class="key" onclick="pressPin('5')">5</button>
      <button class="key" onclick="pressPin('6')">6</button>
      <button class="key" onclick="pressPin('7')">7</button>
      <button class="key" onclick="pressPin('8')">8</button>
      <button class="key" onclick="pressPin('9')">9</button>
      <button class="key" style="font-size:13px;" onclick="clearPin()">ล้าง</button>
      <button class="key" onclick="pressPin('0')">0</button>
      <button class="key" style="font-size:16px;" onclick="delPin()">⌫</button>
    </div>
  </div>

    const REMEMBER_KEY = "calorie_pin_remember_v1";
    const ICON_PREF_KEY = "calorie_icon_pref_v1";
    let typedPin = "";

    function chooseHomeIcon(src) {
      document.getElementById("lock-logo-img").src = src;
      document.getElementById("fav-icon").href = src;
      document.getElementById("apple-icon").href = src;
      document.getElementById("btn-ic-cin").classList.toggle("active", src === "logo_cinnamoroll_diet.jpg");
      document.getElementById("btn-ic-pom").classList.toggle("active", src === "logo_pompompurin_fit.jpg");
      document.getElementById("btn-ic-mus").classList.toggle("active", src === "pompom_muscle_avatar.jpg");
      localStorage.setItem(ICON_PREF_KEY, src);
    }

    (function initIconPref() {
      const savedIc = localStorage.getItem(ICON_PREF_KEY);
      if (savedIc === "logo_pompompurin_fit.jpg" || savedIc === "pompom_muscle_avatar.jpg") {
        chooseHomeIcon(savedIc);
      }
    })();

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    function updateDots(isErr = false) {
      const dots = document.querySelectorAll("#pin-dots .dot");
      dots.forEach((d, idx) => {
        d.className = "dot" + (idx < typedPin.length ? " filled" : "") + (isErr ? " err" : "");
      });
    }

    function pressPin(d) {
      if (typedPin.length >= 6) return;
      document.getElementById("pin-err").textContent = "";
      typedPin += d;
      updateDots();
      if (typedPin.length === 6) {
        tryUnlock(typedPin);
      }
    }

    function delPin() {
      typedPin = typedPin.slice(0, -1);
      updateDots();
    }

    function clearPin() {
      typedPin = "";
      updateDots();
    }

    async function tryUnlock(pinStr, silent = false) {
      try {
        const enc = new TextEncoder();
        const salt = b64ToBytes(SALT_B64);
        const iv = b64ToBytes(IV_B64);
        const ct = b64ToBytes(CT_B64);

        const keyMaterial = await crypto.subtle.importKey(
          "raw",
          enc.encode(pinStr),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
          keyMaterial,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );
        const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
        const html = new TextDecoder().decode(plainBuf);
        localStorage.setItem(REMEMBER_KEY, pinStr);
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        if (!silent) {
          document.getElementById("pin-err").textContent = "❌ รหัส PIN ไม่ถูกต้อง กรุณาลองใหม่";
          updateDots(true);
          setTimeout(() => {
            typedPin = "";
            updateDots(false);
          }, 550);
        } else {
          localStorage.removeItem(REMEMBER_KEY);
        }
      }
    }

    const savedPin = localStorage.getItem(REMEMBER_KEY);
    if (savedPin && savedPin.length === 6) {
      tryUnlock(savedPin, true);
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
